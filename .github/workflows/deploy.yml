name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: api-deploy
  cancel-in-progress: true

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Trigger API deploy hook
        run: curl -fsSL -X POST "${{ secrets.API_DEPLOY_HOOK_URL }}"
